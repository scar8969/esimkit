# Kept so editors and CI runners that look for mypy.ini find the same strict
# configuration declared in pyproject.toml.
[mypy]
python_version = 3.11
mypy_path = src
strict = True
warn_unreachable = True
warn_unused_ignores = True
no_implicit_optional = True
check_untyped_defs = True
show_error_codes = True

[mypy-flask.*]
ignore_missing_imports = True

[mypy-werkzeug.*]
ignore_missing_imports = True

[mypy-sqlalchemy.*]
ignore_missing_imports = True

# Vendored and not installed for the interpreter mypy runs against; a2 and a3
# declare the same override for the same reason.
[mypy-flask_sqlalchemy.*]
ignore_missing_imports = True

# See pyproject.toml: the declarative base is dynamic on purpose.
[mypy-easylpac.models]
disallow_subclassing_any = False
